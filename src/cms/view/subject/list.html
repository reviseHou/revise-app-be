{{#extend "title"}}Môn học{{/extend}}
<div class="card">
    <div class="card-header">
        <a href="/cms/subjects/create" class="btn btn-primary"><i class="fas fa-plus"></i> Tạo mới</a>
    </div>
    <div class="card-body">
        <table class="table table-bordered table-hover js-datatable">
            <thead><tr><th>Mã</th><th>Môn học</th><th>Ngành</th><th>Trạng thái</th><th style="width:170px">Thao tác</th></tr></thead>
            <tbody>
            {{#each subjects}}
            <tr>
                <td>{{code}}</td>
                <td>{{title}}<div class="text-muted small">{{description}}</div></td>
                <td>{{#if major}}{{major.faculty.code}} · {{major.code}} – {{major.name}}{{else}}<span class="text-muted">(chưa thuộc ngành)</span>{{/if}}</td>
                <td>{{> status_badge status=status}}</td>
                <td>
                    <a href="/cms/subjects/{{id}}/edit" class="btn btn-sm btn-warning">Sửa</a>
                    <form method="post" action="/cms/subjects/{{id}}/toggle-status" class="d-inline"><input type="hidden" name="_csrf" value="{{@root.csrfToken}}"><button type="submit" class="btn btn-sm btn-default">{{#if (eq status 'ACTIVE')}}Ẩn{{else}}Hiện{{/if}}</button></form>
                </td>
            </tr>
            {{/each}}
            </tbody>
        </table>
    </div>
</div>
