{{#extend "title"}}{{#if faculty}}Sửa khoa{{else}}Tạo khoa{{/if}}{{/extend}}
{{#extend "breadcrumb"}}<li class="breadcrumb-item"><a href="/cms/faculties">Khoa</a></li>{{/extend}}
<form method="post" action="{{#if faculty}}/cms/faculties/{{faculty.id}}{{else}}/cms/faculties{{/if}}" class="card card-primary card-outline">
    <div class="card-body">
        <div class="form-group">
            <label for="code">Mã khoa</label>
            <input type="text" class="form-control" id="code" name="code" value="{{faculty.code}}" required>
        </div>
        <div class="form-group">
            <label for="name">Tên khoa</label>
            <input type="text" class="form-control" id="name" name="name" value="{{faculty.name}}" required>
        </div>
        <div class="form-group">
            <label for="description">Mô tả</label>
            <input type="text" class="form-control" id="description" name="description" value="{{faculty.description}}">
        </div>
    </div>
    <div class="card-footer">
        <button type="submit" class="btn btn-primary">Lưu</button>
        <a href="/cms/faculties" class="btn btn-default">Quay lại</a>
    </div>
</form>
