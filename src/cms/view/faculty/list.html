{{#extend "title"}}Khoa{{/extend}}
<form method="get" action="/cms/faculties" class="toolbar">
    <div class="search-box"><input type="search" name="keyword" value="{{keyword}}" placeholder="Tìm theo mã hoặc tên khoa"><button type="submit" class="search-btn"><i class="fas fa-search"></i></button></div>
    <a href="/cms/faculties/create" class="btn btn-primary"><i class="fas fa-plus"></i> Tạo mới</a>
</form>
<div class="table-wrap">
        <table class="table table-bordered table-hover">
            <thead><tr><th style="width:60px">STT</th><th>Mã</th><th>Khoa</th><th>Số ngành</th><th>Trạng thái</th><th style="width:170px">Thao tác</th></tr></thead>
            <tbody>
            {{#each faculties}}
            <tr>
                <td>{{add (multiply (add @root.page -1) @root.pageSize) (add @index 1)}}</td>
                <td>{{code}}</td>
                <td>{{name}}<div class="text-muted small">{{description}}</div></td>
                <td>{{majorCount}}</td>
                <td>{{> status_badge status=status}}</td>
                <td class="action-cell">
                    <a href="/cms/faculties/{{id}}/edit" class="btn-icon" title="Chỉnh sửa"><i class="fas fa-pen"></i></a>
                    <button type="button" class="btn-icon" title="{{#if (eq status 'ACTIVE')}}Ngừng hoạt động{{else}}Kích hoạt{{/if}}" data-delete-action="/cms/faculties/{{id}}/toggle-status" data-confirm-title="Bạn có chắc chắn muốn {{#if (eq status 'ACTIVE')}}chuyển sang không hoạt động{{else}}kích hoạt lại{{/if}} không?" data-delete-name="{{name}}"><i class="fas {{#if (eq status 'ACTIVE')}}fa-eye-slash{{else}}fa-eye{{/if}}"></i></button>
                    <button type="button" class="btn-icon danger" title="Xóa" data-delete-action="/cms/faculties/{{id}}/delete" data-delete-name="{{name}}"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
            {{/each}}
            </tbody>
        </table>
</div>
{{> paging}}
