{{#extend "title"}}Ngành{{/extend}}
<form method="get" action="/cms/majors" class="toolbar">
    <div class="search-box"><input type="search" name="keyword" value="{{keyword}}" placeholder="Tìm theo mã hoặc tên ngành"><button type="submit" class="search-btn"><i class="fas fa-search"></i></button></div>
    <a href="/cms/majors/create" class="btn btn-primary"><i class="fas fa-plus"></i> Tạo mới</a>
</form>
<div class="table-wrap">
        <table class="table table-bordered table-hover">
            <thead><tr><th style="width:60px">STT</th><th>Mã</th><th>Ngành</th><th>Khoa</th><th>Trạng thái</th><th style="width:170px">Thao tác</th></tr></thead>
            <tbody>
            {{#each majors}}
            <tr>
                <td>{{add (multiply (add @root.page -1) @root.pageSize) (add @index 1)}}</td>
                <td>{{code}}</td>
                <td>{{name}}<div class="text-muted small">{{description}}</div></td>
                <td>{{faculty.code}} – {{faculty.name}}</td>
                <td>{{> status_badge status=status}}</td>
                <td class="action-cell">
                    <a href="/cms/majors/{{id}}/edit" class="btn-icon" title="Chỉnh sửa"><i class="fas fa-pen"></i></a>
                    <form method="post" action="/cms/majors/{{id}}/toggle-status" class="d-inline"><button type="submit" class="btn-icon" title="{{#if (eq status 'ACTIVE')}}Ẩn{{else}}Hiện{{/if}}"><i class="fas {{#if (eq status 'ACTIVE')}}fa-eye-slash{{else}}fa-eye{{/if}}"></i></button></form>
                </td>
            </tr>
            {{/each}}
            </tbody>
        </table>
</div>
{{> paging}}
