{{#extend "title"}}Thống kê{{/extend}}
<div class="hero"><h2>Xin chào, {{user.username}}</h2><p>Tổng quan và quản lý hệ thống Revise HOU.</p></div>
<div class="row">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header"><h3 class="card-title">Tài liệu theo trạng thái</h3></div>
            <div class="card-body chart-box"><canvas id="statusChart"></canvas></div>
        </div>
    </div>
    <div class="col-md-7">
        <div class="card">
            <div class="card-header"><h3 class="card-title">Tài liệu theo tháng</h3></div>
            <div class="card-body chart-box"><canvas id="monthChart"></canvas></div>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><h3 class="card-title">Tài liệu theo khoa</h3></div>
            <div class="card-body chart-box"><canvas id="facultyChart"></canvas></div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><h3 class="card-title">Người đóng góp nhiều nhất</h3></div>
            <div class="card-body chart-box"><canvas id="uploaderChart"></canvas></div>
        </div>
    </div>
</div>
<p class="text-muted">Lượt xem, bài kiểm tra và đánh giá chưa có trong hệ thống nên chưa thống kê được.</p>
<script type="application/json" id="chartData">{{{chartData}}}</script>
<script src="/cms/resources/plugin/chartjs/chart.umd.min.js"></script>
<script src="/cms/resources/js/home-charts.js"></script>
