{{#extend "title"}}Quyền{{/extend}}
<form method="get" action="/cms/permissions" class="toolbar">
    <div class="search-box"><input type="search" name="keyword" value="{{keyword}}" placeholder="Tìm theo mã hoặc tên quyền"><button type="submit" class="search-btn"><i class="fas fa-search"></i></button></div>
    <a href="/cms/permissions/create" class="btn btn-primary"><i class="fas fa-plus"></i> Tạo mới</a>
</form>
<div class="table-wrap">
        <table class="table table-bordered table-hover">
            <thead><tr><th style="width:60px">STT</th><th>Mã</th><th>Tên quyền</th><th>Mô tả</th></tr></thead>
            <tbody>
            {{#each permissions}}<tr><td>{{add (multiply (add @root.page -1) @root.pageSize) (add @index 1)}}</td><td>{{code}}</td><td>{{name}}</td><td>{{description}}</td></tr>{{/each}}
            </tbody>
        </table>
</div>
{{> paging}}
