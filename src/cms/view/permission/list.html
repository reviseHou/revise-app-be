{{#extend "title"}}Quyền{{/extend}}
<div class="card">
    <div class="card-header">
        <a href="/cms/permissions/create" class="btn btn-primary"><i class="fas fa-plus"></i> Tạo mới</a>
    </div>
    <div class="card-body">
        <table class="table table-bordered table-hover js-datatable">
            <thead><tr><th>Quyền</th></tr></thead>
            <tbody>
            {{#each permissions}}<tr><td>{{name}}</td></tr>{{/each}}
            </tbody>
        </table>
    </div>
</div>
