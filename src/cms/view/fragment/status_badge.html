{{#if (eq status 'PENDING')}}<span class="badge badge-warning">Chờ duyệt</span>{{/if}}
{{#if (eq status 'REJECTED')}}<span class="badge badge-danger">Bị từ chối</span>{{/if}}
{{#if (eq status 'ACTIVE')}}<span class="badge badge-success">Đang hoạt động</span>{{/if}}
{{#if (eq status 'INACTIVE')}}<span class="badge badge-secondary">Không hoạt động</span>{{/if}}
