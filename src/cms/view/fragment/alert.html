{{#if alert.success}}
<div class="alert alert-success alert-dismissible js-auto-close" role="status">
    <button type="button" class="close" data-dismiss="alert" aria-hidden="true">&times;</button>
    <i class="icon fas fa-check"></i> {{alert.success}}
</div>
{{/if}}
{{#if alert.error}}
<div class="alert alert-danger alert-dismissible" role="alert">
    <button type="button" class="close" data-dismiss="alert" aria-hidden="true">&times;</button>
    <i class="icon fas fa-exclamation-triangle"></i> {{alert.error}}
</div>
{{/if}}
